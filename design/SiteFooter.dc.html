<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#221B2E"/><text x="100" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#EDEBF2">CS</text></svg></template>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF2; }
  * { box-sizing: border-box; }
  a { color: #221B2E; text-decoration: none; }
  a:hover { color: #221B2E; }
</style>
</helmet>
<footer style="background: #221B2E; color: #EDEBF2; borderTop: 1px solid #3A3348; font-family: 'Space Grotesk', Helvetica, Arial, sans-serif">
    <div style="max-width: 1440px; margin: 0 auto; padding: clamp(36px, 4.5vw, 64px) clamp(16px, 3vw, 40px); display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 32px">
      <div>
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; text-transform: uppercase; display: flex; gap: 2px; align-items: center; margin-bottom: 14px">
          <span>Cloth</span><span style="background: {{ accent }}; color: #EDEBF2; padding: 0 6px; transform: skewX(-8deg); display: inline-block">SE</span>
        </div>
        <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #B6AEC9; max-width: 30ch">Curated streetwear from the brands you love, all in one place.</p>
        <div style="display: flex; gap: 8px; margin-top: 18px">
          <a href="#instagram" aria-label="Instagram" style="width: 38px; height: 38px; border: 1px solid #4E4660; display: grid; place-items: center; color: #EDEBF2; transition: transform 200ms cubic-bezier(.2,.7,.2,1), background-color 200ms ease-out, border-color 200ms ease-out" style-hover="background: {{ accent }}; border-color: {{ accent }}; transform: translateY(-3px) scale(1.1)" style-active="transform: scale(0.95)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"></circle>
            </svg>
          </a>
          <a href="#facebook" aria-label="Facebook" style="width: 38px; height: 38px; border: 1px solid #4E4660; display: grid; place-items: center; color: #EDEBF2; transition: transform 200ms cubic-bezier(.2,.7,.2,1), background-color 200ms ease-out, border-color 200ms ease-out" style-hover="background: {{ accent }}; border-color: {{ accent }}; transform: translateY(-3px) scale(1.1)" style-active="transform: scale(0.95)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M13.5 21v-7.4h2.6l.4-3h-3V8.7c0-.9.3-1.5 1.6-1.5H16.6V4.4c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2h-2.6v3h2.6V21h3.6Z"></path>
            </svg>
          </a>
        </div>
      </div>
      <sc-for list="{{ footerCols }}" as="col" hint-placeholder-count="3">
        <div>
          <h3 style="margin: 0 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #9A8CFF">{{ col.title }}</h3>
          <div style="display: flex; flex-direction: column; gap: 10px; align-items: start">
            <sc-for list="{{ col.items }}" as="i" hint-placeholder-count="4">
              <a href="{{ i.href }}" style="font-size: 13px; color: #D3CDE2; transition: color 180ms ease-out, transform 200ms cubic-bezier(.2,.7,.2,1)" style-hover="color: #9A8CFF; transform: translateX(5px)">{{ i.label }}</a>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <div>
        <h3 style="margin: 0 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #9A8CFF">Contact</h3>
        <div style="display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: #D3CDE2; align-items: start">
          <a href="#top" style="color: #D3CDE2; transition: color 180ms ease-out, transform 200ms cubic-bezier(.2,.7,.2,1)" style-hover="color: #9A8CFF; transform: translateX(5px)">hey@clothse.com</a>
          <span>0778 222 082</span>
          <span>01 Phu Dong Thien Vuong<br />Da Lat</span>
          <a href="Contact.dc.html" style="margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #9A8CFF; display: inline-flex; align-items: center; gap: 6px; transition: color 180ms ease-out, transform 200ms cubic-bezier(.2,.7,.2,1)" style-hover="color: #EDEBF2; transform: translateX(5px)">Send us a message →</a>
        </div>
      </div>
    </div>
    <div style="borderTop: 1px solid #3A3348; padding: 18px clamp(16px, 3vw, 40px); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #A79CBD; max-width: 1440px; margin: 0 auto">
      <span>© 2026 ClothSE — all rights reserved</span>
    </div>
  </footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:460},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6B5BFF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#6B5BFF&quot;,&quot;#FF6A2B&quot;,&quot;#221B2E&quot;,&quot;#3AC8B0&quot;],&quot;section&quot;:&quot;Brand&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#6B5BFF',
      footerCols: [
        { title: 'Shop', items: [
          { label: 'New arrivals', href: 'New Arrivals.dc.html' },
          { label: 'Tops', href: 'Shop Listing.dc.html?cat=Tops' },
          { label: 'Bottoms', href: 'Shop Listing.dc.html?cat=Bottoms' },
          { label: 'Accessories', href: 'Shop Listing.dc.html?cat=Accessories' },
          { label: 'Footwear', href: 'Shop Listing.dc.html?cat=Footwear' },
          { label: 'Sale', href: 'Sale.dc.html' }
        ] },
        { title: 'Help', items: [
          { label: 'FAQ', href: 'FAQ.dc.html' },
          { label: 'Track order', href: 'My Bag & Orders.dc.html?tab=pending' },
          { label: 'Terms of Service', href: 'Terms of Service.dc.html' },
          { label: 'Privacy', href: 'Privacy Policy.dc.html' }
        ] },
        { title: 'About', items: [
          { label: 'About ClothSE', href: 'About ClothSE.dc.html' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
