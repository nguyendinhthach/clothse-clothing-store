<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#6B5BFF"/><text x="100" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="54" fill="#EDEBF2">CS</text></svg></template>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #EDEBF2; }
  * { box-sizing: border-box; }
  a { color: #221B2E; text-decoration: none; }
  a:hover { color: #221B2E; }
  @keyframes clothse-drop-in { from { opacity: 0; transform: translateY(-10px) scale(0.98); } to { opacity: 1; transform: none; } }
  @keyframes clothse-fade-up { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes clothse-expand { from { opacity: 0; transform: scaleX(0.5); } to { opacity: 1; transform: scaleX(1); } }
</style>
</helmet>
<header style="position: sticky; top: 0; z-index: 50; background: rgba(237,235,242,0.92); backdrop-filter: blur(12px); borderBottom: 1px solid #221B2E; font-family: 'Space Grotesk', Helvetica, Arial, sans-serif; color: #221B2E">
    <div style="max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 40px); height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px">

      <div style="display: flex; align-items: center; gap: clamp(16px, 2.2vw, 34px)">
        <a href="ClothSE Homepage.dc.html" style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; letter-spacing: -0.02em; text-transform: uppercase; display: flex; align-items: center; gap: 2px; transform-origin: left center; transition: transform 200ms cubic-bezier(.2,.7,.2,1)" style-hover="transform: scale(1.05)" style-active="transform: scale(0.98)">
          <span>Cloth</span><span style="background: {{ accent }}; color: #EDEBF2; padding: 0 6px; transform: skewX(-8deg); display: inline-block">SE</span>
        </a>

        <sc-if value="{{ showDesktopNav }}" hint-placeholder-val="{{ true }}">
          <nav style="display: flex; align-items: center; gap: clamp(14px, 1.6vw, 28px); font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em">
            <a href="ClothSE Homepage.dc.html" onMouseEnter="{{ navHome.onEnter }}" onMouseLeave="{{ navHome.onLeave }}" style="position: relative; padding: 6px 0 8px; display: inline-block; transform: {{ navHome.lift }}; transition: transform 200ms ease-out">Home<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #221B2E; transform: {{ navHome.bar }}; transform-origin: center; transition: transform 200ms ease-out"></span></a>
            <a href="New Arrivals.dc.html" onMouseEnter="{{ navNew.onEnter }}" onMouseLeave="{{ navNew.onLeave }}" style="position: relative; padding: 6px 0 8px; display: inline-block; transform: {{ navNew.lift }}; transition: transform 200ms ease-out">New Arrivals<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #221B2E; transform: {{ navNew.bar }}; transform-origin: center; transition: transform 200ms ease-out"></span></a>
            <div onMouseEnter="{{ openShop }}" onMouseLeave="{{ closeShop }}" style="position: relative">
              <a href="Shop Listing.dc.html" onMouseEnter="{{ navShop.onEnter }}" onMouseLeave="{{ navShop.onLeave }}" style="position: relative; padding: 6px 0 8px; display: flex; align-items: center; gap: 6px; transform: {{ navShop.lift }}; transition: transform 200ms ease-out">Shop <span style="font-size: 9px; display: inline-block; transform: {{ shopArrow }}; transition: transform 200ms cubic-bezier(.2,.7,.2,1)">▼</span><span style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #221B2E; transform: {{ navShop.bar }}; transform-origin: center; transition: transform 200ms ease-out"></span></a>
              <sc-if value="{{ shopOpen }}" hint-placeholder-val="{{ false }}">
                <div style="position: absolute; top: 100%; left: -16px; width: 210px; background: #EDEBF2; border: 1px solid #221B2E; padding: 8px; display: flex; flex-direction: column; boxShadow: 8px 8px 0 rgba(34,27,46,0.12); animation: clothse-drop-in 220ms cubic-bezier(.2,.7,.2,1) both; transform-origin: top left">
                  <sc-for list="{{ shopLinks }}" as="l" hint-placeholder-count="4">
                    <a href="{{ l.href }}" style="padding: 11px 12px; font-size: 13px; letter-spacing: 0.06em; display: flex; justify-content: space-between; align-items: center; transition: background-color 160ms ease-out, color 160ms ease-out, padding-left 200ms cubic-bezier(.2,.7,.2,1); animation: clothse-fade-up 240ms cubic-bezier(.2,.7,.2,1) both; animation-delay: {{ l.delay }}" style-hover="background: #221B2E; color: #EDEBF2; padding-left: 18px">
                      <span>{{ l.label }}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.5">{{ l.count }}</span>
                    </a>
                  </sc-for>
                </div>
              </sc-if>
            </div>
            <a href="Sale.dc.html" style="padding: 6px 8px; background: #FF6A2B; color: #EDEBF2; borderRadius: 2px; font-weight: 700; transition: color 180ms ease-out, background-color 180ms ease-out, box-shadow 180ms ease-out" style-hover="background: #221B2E; color: #FF6A2B; box-shadow: 0 0 0 3px rgba(255,106,43,0.35)">Sale</a>
          </nav>
        </sc-if>
      </div>

      <div style="display: flex; align-items: center; gap: 10px">
        <x-import component-from-global-scope="lang-switch" from="./lang-switch.js" hint-size="82px,40px"></x-import>
        <sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
          <input placeholder="Search cargos, tees, kicks…" autofocus="{{ true }}" style="width: clamp(140px, 22vw, 280px); height: 40px; padding: 0 14px; border: 1px solid #221B2E; background: transparent; font-family: 'Space Grotesk', sans-serif; font-size: 14px; outline: none; transform-origin: right center; animation: clothse-expand 260ms cubic-bezier(.2,.8,.2,1) both; transition: box-shadow 180ms ease-out" style-focus="box-shadow: 3px 3px 0 #221B2E" />
        </sc-if>
        <button onClick="{{ toggleSearch }}" aria-label="Search" style="width: 40px; height: 40px; border: 1px solid #221B2E; background: transparent; cursor: pointer; font-size: 15px; display: grid; place-items: center; transition: transform 180ms cubic-bezier(.2,.7,.2,1), background-color 180ms ease-out, box-shadow 180ms ease-out" style-hover="transform: scale(1.12); background: #6B5BFF; color: #EDEBF2; box-shadow: 3px 3px 0 #221B2E" style-active="transform: scale(0.95)">⌕</button>
        <a href="My Bag & Orders.dc.html?tab=bag" aria-label="Bag" style="position: relative; width: 40px; height: 40px; border: 1px solid #221B2E; background: #221B2E; color: #EDEBF2; cursor: pointer; display: grid; place-items: center; transition: transform 180ms cubic-bezier(.2,.7,.2,1), background-color 180ms ease-out, color 180ms ease-out" style-hover="transform: scale(1.12); color: #FF6A2B; box-shadow: 3px 3px 0 #FF6A2B" style-active="transform: scale(0.95); color: #FF6A2B">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
            <path d="M4 7h16l-1.4 12.2a1 1 0 0 1-1 .8H6.4a1 1 0 0 1-1-.8L4 7Z"></path>
            <path d="M8.5 7V5.6A3.5 3.5 0 0 1 12 2.1a3.5 3.5 0 0 1 3.5 3.5V7"></path>
          </svg>
          <span style="position: absolute; top: -7px; right: -7px; background: {{ accent }}; color: #221B2E; border: 1px solid #221B2E; borderRadius: 999px; minWidth: 20px; height: 20px; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; padding: 0 5px">{{ cartCount }}</span>
        </a>
        <sc-if value="{{ showLogin }}" hint-placeholder-val="{{ true }}">
          <a href="Sign In & Sign Up.dc.html" style="height: 40px; padding: 0 14px; border: 1px solid #221B2E; display: flex; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; transition: transform 180ms cubic-bezier(.2,.7,.2,1), background-color 180ms ease-out, color 180ms ease-out" style-hover="transform: scale(1.06); background: {{ accent }}; color: #EDEBF2; border-color: {{ accent }}" style-active="transform: scale(0.97)">Log in</a>
        </sc-if>
        <sc-if value="{{ showAvatar }}" hint-placeholder-val="{{ false }}">
          <div data-account-menu="1" style="position: relative">
            <button onClick="{{ toggleAccount }}" aria-label="Account" style="width: 40px; height: 40px; borderRadius: 999px; border: 1px solid #221B2E; background: {{ accent }}; color: #EDEBF2; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; display: grid; place-items: center; transition: transform 180ms cubic-bezier(.2,.7,.2,1), box-shadow 180ms ease-out" style-hover="transform: scale(1.08); box-shadow: 0 0 0 3px rgba(107,91,255,0.32)" style-active="transform: scale(0.95)">{{ avatarInitials }}</button>
            <sc-if value="{{ accountOpen }}" hint-placeholder-val="{{ false }}">
              <div data-account-menu="1" style="position: absolute; top: calc(100% + 10px); right: 0; width: 244px; background: #EDEBF2; border: 1px solid #221B2E; boxShadow: 8px 8px 0 rgba(34,27,46,0.12); z-index: 60; display: flex; flex-direction: column; transform-origin: top right; animation: clothse-drop-in 200ms cubic-bezier(.2,.7,.2,1) both">
                <div style="padding: 13px 14px; borderBottom: 1px solid #221B2E; display: flex; flex-direction: column; gap: 5px">
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #5F5775">{{ accountRoleLabel }}</div>
                  <div style="font-size: 13px; word-break: break-all">{{ accountEmail }}</div>
                </div>
                <a href="Account.dc.html" onClick="{{ closeAccount }}" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 11px; font-size: 13px; transition: background-color 160ms ease-out, color 160ms ease-out, padding-left 200ms cubic-bezier(.2,.7,.2,1)" style-hover="background: #221B2E; color: #EDEBF2; padding-left: 20px">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.8 20c0-3.6 3.2-5.6 7.2-5.6s7.2 2 7.2 5.6"></path></svg>Account
                </a>
                <a href="My Bag & Orders.dc.html?tab=pending" onClick="{{ closeAccount }}" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 11px; font-size: 13px; transition: background-color 160ms ease-out, color 160ms ease-out, padding-left 200ms cubic-bezier(.2,.7,.2,1)" style-hover="background: #221B2E; color: #EDEBF2; padding-left: 20px">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M4.5 6.5h15v13h-15z"></path><path d="M8.5 6.5V4.2h7v2.3"></path><path d="M8.5 11h7"></path></svg>Orders
                </a>
                <a href="Favourites.dc.html" onClick="{{ closeAccount }}" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 11px; font-size: 13px; transition: background-color 160ms ease-out, color 160ms ease-out, padding-left 200ms cubic-bezier(.2,.7,.2,1)" style-hover="background: #221B2E; color: #EDEBF2; padding-left: 20px">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-9.4A4.1 4.1 0 0 1 12 8.2a4.1 4.1 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20Z"></path></svg>Favourites
                </a>
                <a href="Account.dc.html?tab=settings" onClick="{{ closeAccount }}" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 11px; font-size: 13px; transition: background-color 160ms ease-out, color 160ms ease-out, padding-left 200ms cubic-bezier(.2,.7,.2,1)" style-hover="background: #221B2E; color: #EDEBF2; padding-left: 20px">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3.4v2.2M12 18.4v2.2M4.6 12h2.2M17.2 12h2.2M6.6 6.6l1.6 1.6M15.8 15.8l1.6 1.6M17.4 6.6l-1.6 1.6M8.2 15.8l-1.6 1.6"></path></svg>Settings
                </a>
                <sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ false }}">
                  <a href="Store Management.dc.html" onClick="{{ closeAccount }}" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 11px; font-size: 13px; borderTop: 1px solid #221B2E; borderBottom: 1px solid #221B2E; transition: background-color 160ms ease-out, color 160ms ease-out, padding-left 200ms cubic-bezier(.2,.7,.2,1)" style-hover="background: #6B5BFF; color: #EDEBF2; padding-left: 20px">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M4 9.5h16v10.5H4z"></path><path d="M4 9.5 6 4h12l2 5.5"></path><path d="M9.5 20v-5.5h5V20"></path></svg>Store Management
                  </a>
                </sc-if>
                <sc-if value="{{ notAdmin }}" hint-placeholder-val="{{ true }}">
                  <span style="height: 1px; background: #221B2E; display: block"></span>
                </sc-if>
                <button onClick="{{ signOut }}" style="text-align: left; height: 44px; padding: 0 14px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 11px; font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: #B4471A; transition: background-color 160ms ease-out, color 160ms ease-out, padding-left 200ms cubic-bezier(.2,.7,.2,1)" style-hover="background: #FF6A2B; color: #EDEBF2; padding-left: 20px">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M14.5 4.5h-9v15h9"></path><path d="M18.5 12h-8"></path><path d="m15.5 9 3 3-3 3"></path></svg>Sign Out
                </button>
              </div>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ showMobileToggle }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleMenu }}" aria-label="Menu" style="width: 40px; height: 40px; border: 1px solid #221B2E; background: transparent; cursor: pointer; display: grid; place-items: center; gap: 4px; transition: transform 180ms cubic-bezier(.2,.7,.2,1), background-color 180ms ease-out" style-hover="background: {{ accent }}" style-active="transform: scale(0.94)">
            <span style="width: 18px; height: 2px; background: #221B2E; display: block"></span>
            <span style="width: 18px; height: 2px; background: #221B2E; display: block"></span>
            <span style="width: 12px; height: 2px; background: #221B2E; display: block"></span>
          </button>
        </sc-if>
      </div>
    </div>

    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <nav style="borderTop: 1px solid #221B2E; background: #EDEBF2; padding: 8px clamp(16px, 3vw, 40px) 20px; display: flex; flex-direction: column; animation: clothse-drop-in 240ms cubic-bezier(.2,.7,.2,1) both">
        <a href="ClothSE Homepage.dc.html" style="padding: 14px 0; borderBottom: 1px solid rgba(34,27,46,0.12); font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; text-transform: uppercase; transition: padding-left 200ms cubic-bezier(.2,.7,.2,1)" style-hover="padding-left: 10px">Home</a>
        <a href="New Arrivals.dc.html" style="padding: 14px 0; borderBottom: 1px solid rgba(34,27,46,0.12); font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; text-transform: uppercase; transition: padding-left 200ms cubic-bezier(.2,.7,.2,1)" style-hover="padding-left: 10px">New Arrivals</a>
        <div style="padding: 14px 0; borderBottom: 1px solid rgba(34,27,46,0.12)">
          <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; text-transform: uppercase">Shop</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px">
            <sc-for list="{{ shopLinks }}" as="l" hint-placeholder-count="4">
              <a href="{{ l.href }}" style="padding: 8px 12px; border: 1px solid #221B2E; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; transition: transform 180ms cubic-bezier(.2,.7,.2,1), background-color 180ms ease-out" style-hover="background: {{ accent }}; color: #EDEBF2; transform: translateY(-2px)" style-active="transform: scale(0.96)">{{ l.label }}</a>
            </sc-for>
          </div>
        </div>
        <a href="Sale.dc.html" style="padding: 14px 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; text-transform: uppercase; color: #221B2E"><span style="background: {{ accent }}; padding: 0 8px; display: inline-block">Sale</span></a>
        <sc-if value="{{ showMobileLogin }}" hint-placeholder-val="{{ true }}">
          <a href="Sign In & Sign Up.dc.html" style="margin-top: 12px; padding: 14px; background: #221B2E; color: #EDEBF2; text-align: center; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; transition: transform 180ms cubic-bezier(.2,.7,.2,1)" style-hover="transform: scale(1.02)" style-active="transform: scale(0.98)">Log in / Sign up</a>
        </sc-if>
      </nav>
    </sc-if>
  </header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:420},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6B5BFF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#6B5BFF&quot;,&quot;#FF6A2B&quot;,&quot;#221B2E&quot;,&quot;#3AC8B0&quot;],&quot;section&quot;:&quot;Brand&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shop&quot;}}">
class Component extends DCLogic {
  state = { width: 1440, shopOpen: false, searchOpen: false, menuOpen: false, accountOpen: false, user: null };

  componentDidMount() {
    try { const raw = localStorage.getItem('clothse-user'); if (raw) this.setState({ user: JSON.parse(raw) }); } catch (e) {}
    this.onResize = () => this.setState({ width: window.innerWidth });
    this.onResize();
    window.addEventListener('resize', this.onResize);
    this.onDocClick = (e) => {
      if (!this.state.accountOpen) return;
      if (e.target.closest && e.target.closest('[data-account-menu]')) return;
      this.setState({ accountOpen: false });
    };
    document.addEventListener('click', this.onDocClick);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    document.removeEventListener('click', this.onDocClick);
  }

  hoverProps(key) {
    return {
      onEnter: () => this.setState({ hover: key }),
      onLeave: () => this.setState(s => (s.hover === key ? { hover: null } : null))
    };
  }
  navLink(key) {
    const on = this.state.hover === 'nav-' + key;
    return { ...this.hoverProps('nav-' + key), lift: on ? 'translateY(-2px)' : 'translateY(0)', bar: on ? 'scaleX(1)' : 'scaleX(0)' };
  }

  renderVals() {
    const mobile = this.state.width < 900;
    const user = this.state.user;
    const isAdmin = !!user && (user.role === 'admin' || user.email === 'ngbon2220805@gmail.com');
    return {
      accent: this.props.accent ?? '#6B5BFF',
      cartCount: this.props.cartCount ?? 4,
      showDesktopNav: !mobile,
      showMobileToggle: mobile,
      showLogin: !mobile && !user,
      showMobileLogin: !user,
      showAvatar: !!user,
      isAdmin,
      notAdmin: !isAdmin,
      accountRoleLabel: isAdmin ? 'Signed in as (admin)' : 'Signed in as',
      accountEmail: user ? user.email : '',
      avatarInitials: user ? (user.name || user.email || '').trim().split(/[\s@._-]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') : '',
      accountOpen: !!this.state.accountOpen,
      toggleAccount: () => this.setState(s => ({ accountOpen: !s.accountOpen })),
      closeAccount: () => this.setState({ accountOpen: false }),
      signOut: () => { try { localStorage.removeItem('clothse-user'); } catch (e) {} this.setState({ user: null, accountOpen: false }); },
      shopOpen: this.state.shopOpen && !mobile,
      shopArrow: this.state.shopOpen && !mobile ? 'rotate(0deg)' : 'rotate(180deg)',
      searchOpen: this.state.searchOpen,
      menuOpen: this.state.menuOpen && mobile,
      openShop: () => this.setState({ shopOpen: true }),
      closeShop: () => this.setState({ shopOpen: false }),
      toggleSearch: () => this.setState(s => ({ searchOpen: !s.searchOpen })),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      navHome: this.navLink('home'),
      navNew: this.navLink('new'),
      navShop: this.navLink('shop'),
      shopLinks: [
        { label: 'Tops', count: '48', delay: '40ms', href: 'Shop Listing.dc.html?cat=Tops' },
        { label: 'Bottoms', count: '31', delay: '80ms', href: 'Shop Listing.dc.html?cat=Bottoms' },
        { label: 'Accessories', count: '22', delay: '120ms', href: 'Shop Listing.dc.html?cat=Accessories' },
        { label: 'Footwear', count: '17', delay: '160ms', href: 'Shop Listing.dc.html?cat=Footwear' }
      ]
    };
  }
}
</script>
</body>
</html>
